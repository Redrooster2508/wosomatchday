name: Update player stats

# Rebuilds data/<league>/players.json and matches.json from the latest finished matches.
on:
  schedule:
    - cron: "17 */3 * * *"   # every three hours
  workflow_dispatch:          # run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: player-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build player stats
        run: python3 tools/build_players.py
      - name: Build season heatmaps and shot maps
        run: python3 tools/build_heat.py
      - name: Build season forecasts
        run: python3 tools/build_forecast.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new matches."
          else
            git commit -m "Update player stats"
            git push
          fi
